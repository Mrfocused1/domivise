<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <title>DomiVise Admin — Content Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Raleway:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body is-auth-locked">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="/" target="_blank" rel="noopener" aria-label="Open DomiVise homepage">
        <img class="admin-brand-logo" src="img/logo-white.svg" alt="DomiVise" />
      </a>
      <p class="admin-sidebar-kicker">Page editor</p>
      <nav class="admin-nav" aria-label="Admin sections">
        <a href="#hero" class="is-active">Top section</a>
        <a href="#product">App preview</a>
        <a href="#sections">Page sections</a>
        <a href="#forms">Form &amp; emails</a>
        <a href="#media">Images &amp; footer</a>
      </nav>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div>
          <p class="admin-overline">DomiVise editor</p>
          <h1>Edit your homepage.</h1>
        </div>
        <div class="admin-actions">
          <span class="admin-save-state" id="saveState" role="status">Ready</span>
          <button class="admin-button admin-button-quiet" id="resetBtn" type="button">Start over</button>
          <button class="admin-button admin-button-primary" id="saveBtn" type="button">Publish</button>
        </div>
      </header>
      <div class="admin-toast-region" id="adminNotifications" aria-live="polite" aria-atomic="true"></div>

      <div class="admin-grid">
        <section class="admin-editor" aria-label="Homepage editor">
          <div id="editorMount"></div>
        </section>
        <aside class="admin-preview-panel">
          <div class="admin-preview-head"><div><p class="admin-overline">Live preview</p><h2>Preview</h2></div><a href="/" target="_blank" rel="noopener">Open homepage ↗</a></div>
          <div class="admin-preview-frame"><iframe id="sitePreview" title="Live DomiVise site preview" data-src="/?adminPreview=1"></iframe></div>
          <p class="admin-preview-note">Preview updates as you type.</p>
        </aside>
      </div>
    </main>
  </div>
  <script src="js/supabase-config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
